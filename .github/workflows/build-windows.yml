# Baut BAB-O-BOX.exe in der Cloud (GitHub Actions) – ganz ohne eigenen Windows-Build-PC.
# Repository anlegen, alle Dateien hochladen, unter "Actions" den Lauf starten.
# Jeder Push auf main erzeugt automatisch ein Release mit fertigem ZIP (Seite "Releases").
name: Windows-Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Pakete
        run: pip install -r requirements.txt pyinstaller

      - name: Tesseract installieren
        run: choco install tesseract -y --no-progress

      - name: Deutsches Sprachpaket
        shell: pwsh
        run: |
          $td = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata" -OutFile "$td\deu.traineddata"

      - name: Programm bauen
        run: >
          pyinstaller --noconfirm --clean --windowed --name "BAB-O-BOX"
          --add-data "config_standard.toml;." --add-data "regeln_alt;regeln_alt"
          --collect-all pypdfium2 --collect-all pypdfium2_raw
          bab_gui.py

      - name: Tesseract beilegen
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "dist\BAB-O-BOX\tesseract"
          robocopy $src $dst /E /XF *.traineddata /XD doc /NFL /NDL /NJH /NJS /NP
          foreach ($l in "deu","eng","osd") { if (Test-Path "$src\tessdata\$l.traineddata") { Copy-Item "$src\tessdata\$l.traineddata" "$dst\tessdata\" } }
          Copy-Item LIESMICH_ANWENDER.md dist\BAB-O-BOX\
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: BAB-O-BOX-Windows
          path: dist/BAB-O-BOX

      - name: Release mit ZIP anlegen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\BAB-O-BOX -DestinationPath BAB-O-BOX-Windows.zip
          gh release create "v1.0.${{ github.run_number }}" BAB-O-BOX-Windows.zip --target "${{ github.sha }}" --title "BAB-O-BOX 1.0.${{ github.run_number }}" --notes "ZIP herunterladen, entpacken, BAB-O-BOX.exe starten. Kurzanleitung: LIESMICH_ANWENDER.md im Ordner."
