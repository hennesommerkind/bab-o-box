# BAB-O-BOX – STANDARDREGELN
# Diese Datei kommt mit jedem Update neu. Eigene Abweichungen (z. B. andere Ninox-Feldnamen) gehören in
# "eigene_regeln.toml" im Datenordner (App: Einstellungen → "Eigene Regeln bearbeiten").
version = 5
#
# Die Muster sind auf die Bescheide der Agentur für Arbeit abgestimmt (Stand 2025/2026):
#   Kopf:        "Kundennummer: 022P425485"  /  "Mein Zeichen: 021-022P425485"  /  Barcode *022P425485*
#   Datum:       "Datum: 03. Dezember 2025"
#   Überschrift: "Änderungsbescheid zum Bescheid vom 13.11.2025"  oder  "Bescheid für <Name>, geb. am 25.04.2005"
#   Tabelle:     "von bis mtl. Betrag"  →  "06.10.2025 31.03.2027 2.015,00 €"  (ggf. mehrere Zeilen)
# OCR-Fehler sind eingeplant: ä→a, ü→ii/u, § → $/8, "Ill" statt "III".

[ocr]
dpi = 300
jpeg_qualitaet = 80
timeout_s = 300

[ki]
max_zeichen = 6000
timeout_s = 180

[ueberwachung]
stabil_warten_s = 3

[regeln]
# Ohne diese Felder geht ein Dokument nach "Prüfen". Die Kundennummer wird gesondert behandelt:
# fehlt sie, reicht das Geburtsdatum, wenn in Ninox ein Geburtsdatum-Feld konfiguriert ist.
pflichtfelder = ['kategorie', 'bescheiddatum']
# Nur für "hinweis"-Muster der Kategorien: wie weit vorn im Text gesucht wird
kategorie_suchbereich_zeichen = 6000
# Fehlt dieses Wort im ganzen Dokument, kommt ein Hinweis ins Protokoll (kein Stopp)
erforderliches_stichwort = 'Berufsausbildungsbeihilfe|BAB'
# Änderungsbescheid ohne erkannten Grund, dessen Abschnitt genau am Stichtag eines neuen Kostensatzes beginnt
# (s. ninox.kostensaetze) → nach "Prüfen", weil es vermutlich ein Änderungsbescheid TS ist. [] = abschalten
verdacht_ts_bei = ['Änderung']
# Wörter, die nie Teil eines Namens sind (Anschreiben an das Haus, Agentur …)
name_sperrworte = ['Kolping', 'Jugendwohnen', 'Agentur', 'Arbeit', 'Bescheid', 'Leistung', 'Frau ', 'Herr ']

[dateiname]
# Platzhalter: {name} {ninox_name} {haus} {kategorie} {datum} {kundennummer} {geburtsdatum} {von} {bis}
#   {haus}       = Kürzel des erkannten Hauses (aus den Ninox-Stammdaten)
#   {name}       = Name wie im Bescheid gelesen ("Nachname_Vorname"); nicht lesbar → Name aus Ninox → "ohne-Name"
#                  Der Name dient NUR dem Dateinamen – die Zuordnung in Ninox läuft über Kundennummer/Geburtsdatum.
#   {ninox_name} = Name aus Ninox (name_ausdruck, s. u.)
#   {datum}      = Bescheiddatum
# Gleiche Namen bekommen automatisch _2, _3 … angehängt.
schema = '{kundennummer}_BAB-{kategorie}_{name}.pdf'

# --------------------------------------------------------------------------- Suchmuster
# Werden alle angewendet; Gruppe 1 ist der Wert (Tabellenzeile: Gruppen 1–3).
# Mit echten Bescheiden über den Reiter "Analyse" prüfen.
[muster]
# Kundennummer: beschriftet (zählt 3-fach) …
kundennummer_beschriftet = [
  '(?:Kunden-?\s*nummer|Kd\.?-?\s*Nr\.?)\s*:?\s*(\d{3}\s?[A-Z]\s?\d{6})',
  'Mein\s+Zeichen\s*:?\s*\d{3}-(\d{3}[A-Z]\d{6})',
]
# … und frei im Text, z. B. Barcode-Zeile *022P425485* (zählt 1-fach)
kundennummer_frei = [
  '(?<![A-Z0-9])(\d{3}[A-Z]\d{6})(?![A-Z0-9])',
]
# "Datum: 03. Dezember 2025" (zählt 3-fach)
bescheiddatum = [
  'Datum\s*:?\s*(\d{1,2}\.?\s*(?:Januar|Februar|M[äa]e?rz|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s*\d{4})',
  'Datum\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})',
]
# "… zum Bescheid vom 03.12.2025" / "anbei erhalten Sie den Änderungsbescheid vom 03.12.2025" (zählt 1-fach je Fundstelle)
bescheiddatum_fallback = [
  '(?:Bescheid|Berechnungsbogen\s+BAB)\s+vom\s+(\d{1,2}\.\d{1,2}\.\d{4})',
]
# Name der/des Auszubildenden – Gruppe 1. Wird geprüft (nur Buchstaben, 2–5 Wörter, keine Sperrworte).
# NICHT "Guten Tag …" verwenden: bei Abtretung ist das Kolping als Empfänger.
name = [
  'Name,\s*Vorname\s*:?\s*([A-ZÄÖÜ][^\n(]{2,60}?)\s*(?:\(|\n|$)',
  'Bescheid\s+f[üu]e?r\s+([A-ZÄÖÜ][^\n,]{2,60}?)\s*,?\s*geb',
  'Leistungsangelegenheit\s+([A-ZÄÖÜ][^\n,]{2,60}?)\s*,?\s*geb',
  'Kundenname\s+([A-ZÄÖÜ][^\n]{2,60}?)\s+\d{3}\s?[A-Z]\s?\d{6}',
]
# "auf dem am 16.09.2025 gestellten Antrag" – damit wird der passende Antrag in Ninox gefunden
antragsdatum = [
  'am\s+(\d{1,2}\.\d{1,2}\.\d{4})\s+gestellten\s+Antrag',
  'Ihr(?:em|en)?\s+Antrag\s+vom\s+(\d{1,2}\.\d{1,2}\.\d{4})',
]
# "… für die Zeit ab 01.06.2027 erst ausgezahlt, wenn Sie … den letzten Tag der Abschlussprüfung nachweisen"
# → Notiz am Bescheid
auszahlung_nach_nachweis = [
  'f[üu]e?r\s+die\s+Zeit\s+ab\s+(\d{1,2}\.\d{1,2}\.\d{4})\s+erst\s+ausgezahlt',
]
geburtsdatum = [
  'geb\.?\s*am\s*(\d{1,2}\.\d{1,2}\.\d{4})',
  'Geburtsdatum\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})',
  'Leistungsangelegenheit\s.{0,60}?\bam\s+(\d{1,2}\.\d{1,2}\.\d{4})',
]
# Tabellenzeile unter "von bis mtl. Betrag": Datum Datum [OCR-Rest] Betrag €
tabellenzeile = [
  '^\s*(\d{2}\.\d{2}\.\d{4})\s+(\d{2}\.\d{2}\.\d{4})\s+[^\d\n]{0,6}(\d{1,3}(?:\.\d{3})*,\d{2})\s*(?:€|EUR)',
]
# Nur falls keine Tabelle gefunden wurde:
zeitraum = [
  '(?:Zeitraum\s+)?vo[nm]\s*(\d{1,2}\.\d{1,2}\.\d{4})\s*bis\s*(?:zum\s*)?(\d{1,2}\.\d{1,2}\.\d{4})',
]
betrag = [
  'BAB-A\s*\(Berufsausbildung\)\s*(\d{1,3}(?:\.\d{3})*,\d{2})\s*(?:€|EUR)',
  '(?:monatlich|mtl\.|in\s+H[öo]e?he\s+von)[^\d]{0,40}?(\d{1,3}(?:\.\d{3})*,\d{2})\s*(?:€|EUR)',
]

# --------------------------------------------------------------------------- Kategorien
# "kopf"    = Überschrift/Betreff – gewinnt immer (das am weitesten oben stehende Kopf-Muster).
# "hinweis" = schwächere Stichwörter, nur wenn kein Kopf-Muster passt.
# Wichtig: "Bewilligung", "aufgehoben", "zurückgenommen" stehen als Standardtext in JEDEM Änderungsbescheid –
# deshalb gehören solche Wörter nicht zu "kopf".
# "name" muss exakt dem Auswahlwert in Ninox entsprechen.
[[kategorien]]
name    = 'Anhörung'
kopf    = ['Anh[öo]e?rung\s+(?:zur|zum|gem[äa]e?[ßBs8]|nach)', '^\s*Anh[öo]e?rung\b']
hinweis = ['Gelegenheit\s+zur\s+(?:Stellungnahme|[ÄA]e?u[ßs]erung)']

[[kategorien]]
name    = 'Mitwirkung'
kopf    = ['Aufforderung\s+zur\s+Mitwirkung', 'fehlende\s+Unterlagen', 'Mitwirkungspflicht']
hinweis = ['reichen\s+Sie\s+.{0,60}\s+(?:ein|nach)', 'Unterlagen\s+nach(?:zu)?reichen']

[[kategorien]]
name    = 'Aufhebung'
kopf    = ['Aufhebungs-?\s*(?:und\s+Erstattungs)?bescheid', 'Erstattungsbescheid', 'R[üu]e?cknahme-?\s*und\s+Erstattungsbescheid']
hinweis = ['Erstattungsforderung', 'zu\s+erstatten(?:de|den)?\s+Betrag']

[[kategorien]]
name    = 'Änderung'
kopf    = ['[ÄA]e?nderungsbescheid']
hinweis = ['[ÄA]e?nderung\s+der\s+Bewilligung', 'neu\s+berechnet']

[[kategorien]]
name    = 'Ablehnung'
kopf    = ['Ablehnungsbescheid', '^\s*Ablehnung\s+(?:Ihres|des)\s+Antrag']
hinweis = ['lehne\s+ich\s+.{0,80}\s+ab\b', 'kann\s+nicht\s+bewilligt\s+werden', 'wird\s+abgelehnt']

[[kategorien]]
name    = 'Bewilligung'
kopf    = ['^\s*Bescheid\s+f[üu]e?r\s', 'Bewilligungsbescheid']
hinweis = ['bewillige\s+ich', 'Bewilligung']

# --------------------------------------------------------------------------- Unterarten
# Verfeinern eine erkannte Kategorie ("basis") anhand des Begründungstextes. Passen zwei → "Prüfen".
# ACHTUNG: "BAföG", "Freibetrag", "Unterbringung", "Wohnheim" stehen in JEDEM Bescheid als Standardtext –
# nur eindeutige Formulierungen verwenden. Mit "Analyse" an echten Bescheiden prüfen.
# (BAf.G: OCR liest "BAföG" oft als "BAf6G"/"BAfSG".)
[[unterarten]]
basis  = 'Änderung'
name   = 'Änderung BAföG'
muster = [
  'BAf.G-?\s*[ÄA]e?nderungsgesetz',
  '\d+\.\s*Gesetz\s+zur\s+[ÄA]e?nderung\s+des\s+Bundesausbildungsf',
  'Gesetz\s+zur\s+[ÄA]e?nderung\s+des\s+Bundesausbildungsf',
  '(?:Anhebung|Erh[öo]e?hung|Anpassung|[ÄA]e?nderung)\s+der\s+(?:Freibetr[äa]e?ge|Bedarfss[äa]e?tze|Einkommensfreibetr)',
  'ge[äa]e?nderte[nr]?\s+(?:Freibetr[äa]e?ge|Bedarfss[äa]e?tze)',
]

[[unterarten]]
basis  = 'Änderung'
name   = 'Änderung TS'
muster = [
  'Tagess[äa]e?tze?s?',
  '(?:ge[äa]e?nderte[nrs]?|neue[nrs]?|erh[öo]e?hte[nrs]?|Erh[öo]e?hung\s+de[rs]|Anpassung\s+de[rs]|[ÄA]e?nderung\s+de[rs])\s+(?:Kostens[äa]e?tze?s?|Unterbringungskosten|Kosten\s+(?:der|f[üu]e?r\s+die)\s+Unterbringung|Entgelte?s?|Heimkosten|Internatskosten)',
  '(?:neue|ge[äa]e?nderte)\s+(?:Entgelt|Leistungs)vereinbarung',
]

# --------------------------------------------------------------------------- Antragsart (nur Kontrolle)
# Die Antragsart (Erstbewilligung, Weiterbewilligung …) steht am Antrag in Ninox – der Bescheid erbt sie,
# weil er am passenden Antrag (über das Antragsdatum) abgelegt wird. Diese Muster dienen nur der Gegenprobe:
# deutet der Bescheid auf eine andere Art als der gefundene Antrag, gibt es einen Hinweis.
# EB/WB lassen sich am Bescheid nicht sicher unterscheiden (z. B. ein einziger Bescheid bei späterem Einzug
# oder zweijähriger Ausbildung) – dafür gibt es bewusst kein Muster.
[[antragsart_hinweise]]
name   = 'Verlängerung wg. nicht-best. Prüfung'
muster = ['Wiederholungspr[üu]e?fung', 'nicht\s+bestandene[nr]?\s+(?:Abschluss|Gesellen)?pr[üu]e?fung']

[[antragsart_hinweise]]
name   = 'reguläre Ausb-Verlängerung'
muster = ['Verl[äa]e?ngerung\s+(?:der|Ihrer)\s+(?:Berufs)?[Aa]usbildung(?:szeit|sdauer)?']

# --------------------------------------------------------------------------- Ninox
# Aufbau wie in eurer Ninox-Datenbank:
#   Bewohner*in  →  Antrag (neuester)  →  Bescheid  →  Bewilligungsabschnitte (eine Zeile je Zeitraum)
#                                                   →  Dokument (mit der PDF)
# Tabellen werden über ihren NAMEN gefunden. In der App zeigt "Verbindung testen" alle Tabellen und Felder
# und meldet, wenn ein Name hier nicht passt.

[ninox.bewohner]
tabelle           = 'Bewohner*innen'
feld_kundennummer = 'BA-Kundennummer'
# Datumsfeld mit dem Geburtsdatum ('' = keins). Zweiter Suchschlüssel + Gegenprobe zur Kundennummer.
feld_geburtsdatum = 'Geburtsdatum'
# Ninox-Ausdruck für den Namen (Dateiname, Protokoll)
name_ausdruck     = 'Nachname + "_" + Vorname'

[ninox.antrag]
# Der Bescheid wird an den Antrag gehängt, dessen Datum zum "am … gestellten Antrag" im Bescheid passt
# (± toleranz_tage). Kein passender → bei nur einem Antrag dieser, sonst "Prüfen".
# Ohne Antragsdatum im Bescheid → neuester Antrag.
# tabelle = '' → Bescheid hängt direkt an der Person (dann bescheid.feld_eltern = Verknüpfung zur Person).
tabelle           = 'Anträge'
feld_bewohner     = 'Bewohner*in'
feld_antragsdatum = 'Antragsdatum'           # Datumsfeld; '' = immer neuester Antrag
feld_antragsart   = 'Antragsart'             # nur für die Gegenprobe; '' = keine
toleranz_tage     = 14

[ninox.bescheid]
tabelle     = 'Bescheide'
feld_eltern = 'Antrag'                       # Verknüpfung Bescheid → Antrag
[ninox.bescheid.felder]
datum  = 'Datum des Bescheides'
status = 'Status'
notiz  = 'Notiz'                             # z. B. "Ab 01.06.2027 Auszahlung erst nach Nachweis …"; '' = nicht setzen

[ninox.abschnitte]
tabelle     = 'Bewilligungsabschnitte'
feld_eltern = 'Bescheid'
[ninox.abschnitte.felder]
beginn     = 'Beginn'
ende       = 'Ende'
betrag     = 'Bewilligtes BAB'
kostensatz = 'Kostensatz'
# EA inkl. VP, VP, ZZB, Wertminderung trägt weiterhin ihr ein bzw. berechnet Ninox.

# --- Stammdaten der Häuser aus Ninox (werden täglich geladen und lokal gespeichert)
# Häuser: über Straße + PLZ im Bescheid wird das Haus erkannt.
# Kostensätze: je Abschnitt der neueste Kostensatz DES ERKANNTEN HAUSES, der zum Beginn schon gilt.
# haeuser_tabelle = '' → keine Stammdaten; dann gelten die Kostensätze weiter unten für alle.
[ninox.stammdaten]
haeuser_tabelle      = 'Häuser'
kostensaetze_tabelle = 'Kostensätze'

[ninox.stammdaten.haeuser_felder]
name      = 'Name'
kuerzel   = 'Kürzel'
strasse   = 'Straße'
plz       = 'PLZ'
ort       = 'Ort'
anschrift = ''                               # falls die Anschrift in EINEM Feld steht: dessen Name

[ninox.stammdaten.kostensaetze_felder]
bezeichnung = 'Bezeichnung'                  # Anzeige, z. B. "B-PB 01/25 (ab 01.01.2025)"
ab          = 'Gültig ab'
haus        = 'Haus'                         # Verknüpfung zum Haus

# Nur ohne Stammdaten: Kostensätze aus dieser Liste ("name" = Auswahlwert in Ninox)
[[ninox.kostensaetze]]
name = 'B-PB 01/25 (ab 01.01.2025)'
ab   = '2025-01-01'
[[ninox.kostensaetze]]
name = 'B-PB 01/26 (ab 01.01.2026)'
ab   = '2026-01-01'

[ninox.dokument]
tabelle     = 'Dokumente'
feld_eltern = 'Bescheid'                     # Bescheide IMMER am Bescheid ablegen, nicht am Antrag
kategorie_wert     = 'Bescheid'              # Wert für "Dokumentkategorie"
erstellt_von_wert  = ''                      # z. B. 'BAB Berlin Prenzlauer-Berg' ('' = nicht setzen)
bringer_wert       = ''                      # 'Azubi' oder 'Eltern' ('' = nicht setzen)
# Platzhalter: {dokumentart} {monat} {jahr} {jahr2} {datum} {kategorie}  → z. B. "BAB Bescheid 10/25"
beschreibung = '{dokumentart} {monat}/{jahr2}'
[ninox.dokument.felder]
datum        = 'Datum'                       # bekommt das heutige Datum
kategorie    = 'Dokumentkategorie'
art          = 'Dokumentart'
beschreibung = 'Beschreibung'
erstellt_von = 'Erstellt von'
bringer      = 'Dokumentenbringer'
hinweise     = ''                            # optional: Textfeld für Erkennungs-Hinweise
datei        = 'Datei'                       # Datei-Feld; '' = PDF nur als Anhang am Datensatz

# Was je erkannter Art angelegt wird.
# status/dokumentart = Auswahlwerte in Ninox. aktion = 'manuell' → nicht automatisch, sondern "Prüfen".
[ninox.zuordnung.Bewilligung]
dokumentart = 'BAB Bescheid'
status      = 'bewilligt'

[ninox.zuordnung."Änderung"]
dokumentart = 'BAB Änderungsbescheid'
status      = 'bewilligt'

[ninox.zuordnung."Änderung BAföG"]
dokumentart = 'BAB Änderungsbescheid Bafög'
status      = 'bewilligt'

[ninox.zuordnung."Änderung TS"]
dokumentart = 'BAB Änderungsbescheid TS'
status      = 'bewilligt'

[ninox.zuordnung.Ablehnung]
dokumentart = 'BAB Bescheid'
status      = 'abgelehnt'
abschnitte  = false

[ninox.zuordnung.Aufhebung]
dokumentart = 'BAB Änderungsbescheid'
status      = 'noch zu prüfen'

[ninox.zuordnung."Anhörung"]
aktion = 'manuell'

[ninox.zuordnung.Mitwirkung]
aktion = 'manuell'
